CONFIG_BSP_USING_SDIO=y
CONFIG_BSP_USING_SDMMC2=y
CONFIG_SDIO2_CARD_MODE=2
CONFIG_SD2_MAX_FREQ=48000000
# CONFIG_BSP_WIFI_SWT6621 is not set
CONFIG_WIFI_USING_AIC8800_RTOS=y
CONFIG_AIC8800_RTOS_WIRELESS_PWR_GPIO=124
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_FINSH_THREAD_STACK_SIZE=6144
CONFIG_RT_USING_SYSTEM_WORKQUEUE=y
CONFIG_RT_SERIAL_RB_BUFSZ=256
CONFIG_RT_SDIO_THREAD_PRIORITY=9
CONFIG_RT_SDIO_DEBUG=y
# CONFIG_RT_USING_POSIX is not set
CONFIG_RT_USING_NETDEV=y
CONFIG_RT_USING_LWIP=y
CONFIG_RT_USING_LWIP212=y
CONFIG_RT_LWIP_TCPTHREAD_PRIORITY=8
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_ETHTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_DEBUG=y
CONFIG_RT_USING_ULOG=y
CONFIG_RT_USING_MEMTRACE=y
CONFIG_PKG_USING_NETUTILS=y
CONFIG_PKG_NETUTILS_IPERF=y
