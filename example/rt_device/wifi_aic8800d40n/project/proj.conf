# ============================================================================
# AIC8800D40N SDIO WiFi 示例工程 — proj.conf
#
# 驱动路径 : customer/peripherals/wifi/aic8800d40n/
# 芯片型号 : AIC8800D40N / D40LN / D40WN / D80 / D80N
# 集成路线 : 路线1 — 驱动自建 lwIP netif, 不依赖 rt_wlan 框架
#
# 目标板   : sf32lb55-lcd_n16r4n4 (SOC_SF32LB55X)
#            ★ 与驱动包基准板 eh-lb525 (SOC_SF32LB52X) 的差异见下方 SDIO 段
# ============================================================================

# ==== SDIO: LB55X 走 SDHCI 控制器 (LB52X 才走线性 SDIO / BSP_USING_SD_LINE) ====
CONFIG_BSP_USING_SDIO=y
CONFIG_BSP_USING_SDMMC2=y
CONFIG_SDIO2_CARD_MODE=2
# 注: LB55X 的 SDIO2 引脚 PAD_PA44/45/47/49/51/55 已在
#     customer/boards/sf32lb55-lcd_base/bsp_pinmux.c 中定义, 无需额外改引脚。
# 注: LB52X 示例中的 "# CONFIG_BSP_ENABLE_MPI2 is not set" (MPI2 与 SDIO 引脚冲突)
#     对 LB55X 不适用, 此处不设置。

# ==== AIC8800D40N RTOS 驱动 ====
CONFIG_WIFI_USING_AIC8800D40N=y
# 路线1 不接 SDK rt_wlan / 旧驱动 / AIC8800MC
# CONFIG_RT_USING_WIFI is not set
# CONFIG_AIC_WLAN_AIC8800D40L is not set
# CONFIG_WIFI_USING_AIC8800MC is not set

# ==== WiFi 电源 / 复位引脚 (宏名与旧驱动 aic8800d40 一致) ====
# LDO EN 引脚: 使能 WiFi 芯片供电 (高有效)
#   取值依据: 目标板 board.conf 的 CONFIG_WIFI_POWER_PIN=124,
#   与 example/rt_device/wifi (D40 跑板配置) 的 CONFIG_AIC_WIRELESS_PWR_GPIO=124 一致。
#   ★ 若你的模组由硬件常供电/走其他脚, 请按原理图修改。
CONFIG_AIC_WIRELESS_PWR_GPIO=124
# 硬复位引脚 (低有效)。目标板无独立复位控制, 保持 -1。
CONFIG_AIC_DEV_AIC8800D40N_WLAN0_RST_GPIO=-1
# 唤醒脚 (按需)
CONFIG_AIC8800D40N_WIFI_HOST_WAKE_GPIO=-1
CONFIG_AIC8800D40N_WIFI_WAKE_HOST_GPIO=-1

# ==== 线程栈 ====
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_FINSH_THREAD_STACK_SIZE=6144

# ==== 工作队列 / 串口 ====
CONFIG_RT_USING_SYSTEM_WORKQUEUE=y
CONFIG_RT_SERIAL_RB_BUFSZ=256
# CONFIG_RT_USING_POSIX is not set

# ==== SDIO 线程 ====
CONFIG_RT_SDIO_THREAD_PRIORITY=9

# ==== lwIP 2.1.2 + DHCP + DNS ====
CONFIG_RT_USING_NETDEV=y
CONFIG_RT_USING_LWIP=y
CONFIG_RT_USING_LWIP212=y
CONFIG_RT_LWIP_DHCP=y
CONFIG_RT_LWIP_DNS=y
CONFIG_RT_LWIP_TCPTHREAD_PRIORITY=8
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_ETHTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_DEBUG=y

# ==== 日志 / 内存诊断 ====
CONFIG_RT_USING_ULOG=y
CONFIG_RT_USING_MEMTRACE=y

# ==== iperf 吞吐测试(可选) ====
CONFIG_PKG_USING_NETUTILS=y
CONFIG_PKG_NETUTILS_IPERF=y

# ==== 重要: 不要打开 SDK mbedTLS ====
# 驱动自带 lib/libaic_mbedtls.a。若同时开 CONFIG_PKG_USING_MBEDTLS,
# 会与驱动库的 aes_*/utils.c 产生 multiple definition 链接冲突。
# CONFIG_PKG_USING_MBEDTLS is not set
