# Board-specific config for the EPD board (1024x758 panel, dual 4MB PSRAM).
# Full-screen LVGL (LV_RES_AUTO = 1024x758) keeps the SCALE transition
# animation, whose double buffer takes ~3.1MB of PSRAM1. The PSRAM1 budget is:
#   anim double buffer 3.1MB + image cache + FT cache 0.4MB + message 96KB <= 4MB
# so the image cache must be shrunk from the project default 1.1MB to fit.
CONFIG_IMAGE_CACHE_IN_PSRAM_SIZE=400000
