# ============================================================================
# AIC8800D80 SDIO WiFi 集成工程 — proj.conf (board: eh-lb525 / SOC_SF32LB52X)
# 路线1: 驱动自建 lwIP netif, 不用 SDK eth_device/rt_wlan
#
# [AIC8800-PORT][SiFli] SDIO 路线: 保持本平台既有的 **SDMMC2/SDHCI** 路线。
#   厂家 diff 包主张的线性 SDIO(BSP_USING_SD_LINE) 面向 LB52x(无 SDHCI);
#   本工程实际使用 LB55x(有 SDHCI), 故不采纳, 维持 SDHCI。
#   若确需线性 SDIO: 改为 CONFIG_BSP_USING_SD_LINE=y 并去掉下面三行;
#   注意 SDK 侧 sdio.c / drv_sdhci.c 的本地补丁是按 SDHCI 路线准备的
#   (见 example/aic8800_d80/docs/sdio_detect_card.md)。
# ============================================================================

# ==== 板级: 关 MPI2(默认 NAND, 与 SDIO 引脚 PA12~PA17 冲突) ====
# CONFIG_BSP_ENABLE_MPI2 is not set

# ==== SDIO: SDHCI 路线 (SDMMC2) ====
CONFIG_BSP_USING_SDIO=y
CONFIG_BSP_USING_SDMMC2=y
CONFIG_SDIO2_CARD_MODE=2
CONFIG_SD2_MAX_FREQ=24000000
# (线性 SDIO 备选)
# CONFIG_BSP_USING_SD_LINE=y

# ==== AIC8800 RTOS 驱动 (customer/peripherals/wifi/aic8800_rtos_driver) ====
CONFIG_WIFI_USING_AIC8800_RTOS=y
# 板级 WiFi 上电引脚 (WL_REG_ON); -1 = 不用 GPIO 控制
CONFIG_AIC8800_RTOS_WIRELESS_PWR_GPIO=124
# 路线1(默认): 驱动自建 lwIP netif, 不接 rt_wlan 框架。
# 如需 RT-Thread 标准 Wi-Fi 管理框架: 开启 CONFIG_AIC8800_USE_RT_WLAN=y
#   (自动 select RT_USING_WIFI, netif 交由框架持有, 并发降级为单 STA/AP)
# CONFIG_RT_USING_WIFI is not set
# CONFIG_AIC8800_USE_RT_WLAN is not set
# CONFIG_WIFI_USING_AIC8800MC is not set

# ==== 线程栈 ====
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_FINSH_THREAD_STACK_SIZE=6144

# ==== 工作队列 / 串口 ====
CONFIG_RT_USING_SYSTEM_WORKQUEUE=y
CONFIG_RT_SERIAL_RB_BUFSZ=256
# CONFIG_RT_USING_POSIX is not set

# ==== lwIP 2.1.2 + DHCP + DNS + netdev ====
CONFIG_RT_USING_NETDEV=y
CONFIG_RT_USING_LWIP=y
CONFIG_RT_USING_LWIP212=y
CONFIG_RT_LWIP_DHCP=y
CONFIG_RT_LWIP_DNS=y
CONFIG_RT_LWIP_TCPTHREAD_PRIORITY=8
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_ETHTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_DEBUG=y

# ==== 日志 / 内存诊断 ====
CONFIG_RT_USING_ULOG=y
CONFIG_RT_USING_MEMTRACE=y

# ==== iperf 吞吐测试(可选) ====
CONFIG_PKG_USING_NETUTILS=y
CONFIG_PKG_NETUTILS_IPERF=y

# 注: 不开 PKG_USING_MBEDTLS —— 驱动自带 lib/libaic_mbedtls.a, 避免 aes_*/utils.c 符号冲突
